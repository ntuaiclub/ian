name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.digest_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "digest_ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy Production
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy immutable image
        env:
          DEPLOY_HOST: ${{ vars.IAN_DEPLOY_HOST }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$DEPLOY_HOST"
          tailscale ssh "deploy@${DEPLOY_HOST}" bash -s -- "$IMAGE" "$RELEASE_TAG" <<'REMOTE'
          set -Eeuo pipefail

          image="$1"
          release_tag="$2"
          app_dir="${IAN_APP_DIR:-/opt/ian/app}"
          status_url="${IAN_WEBHOOK_STATUS_URL:-http://127.0.0.1:5190/status}"
          health_timeout_seconds="${IAN_HEALTH_TIMEOUT_SECONDS:-180}"

          cd "$app_dir"
          git fetch origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          git checkout --detach "$release_tag"

          previous_image="$(docker inspect --format '{{.Config.Image}}' ntuai-ian-agent 2>/dev/null || true)"
          export IAN_WEBHOOK_BIND_ADDRESS=127.0.0.1

          wait_for_liveness() {
            local deadline=$((SECONDS + health_timeout_seconds))

            until curl --fail --silent --show-error "$status_url" >/dev/null; do
              ((SECONDS < deadline)) || return 1
              sleep 2
            done
          }

          activate() {
            export IAN_IMAGE="$1"
            docker compose pull ntuai-ian-agent
            docker compose up --detach --no-build --remove-orphans ntuai-ian-agent
            wait_for_liveness
          }

          if ! activate "$image"; then
            if [[ "$previous_image" == ghcr.io/ntuaiclub/ian@sha256:* ]] && activate "$previous_image"; then
              printf 'Rollback succeeded: %s\n' "$previous_image" >&2
            fi
            docker compose ps
            docker compose logs --tail=200 ntuai-ian-agent || true
            exit 1
          fi

          docker compose exec --no-TTY ntuai-ian-agent \
            curl --fail --silent --show-error http://localhost:5191/ready || \
            printf 'Warning: MCP dependency readiness is not yet healthy.\n' >&2
          REMOTE
